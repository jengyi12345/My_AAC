<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAC 溝通</title>
<style>
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body {
    font-family: "Microsoft JhengHei","PingFang TC","Helvetica Neue",Arial,sans-serif;
    background:#f0f4f8;
    color:#222;
  }
  #app {
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }
  header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
    background:#2c5f8a;
    color:#fff;
    flex-wrap:wrap;
    gap:8px;
    flex-shrink:0;
  }
  header h1 { font-size:1.25rem; margin:0; }
  button {
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:0.95rem;
    background:#3d7ab5;
    color:#fff;
  }
  button:hover { background:#2c5f8a; }
  header button { background:#f5a623; }
  header button:hover { background:#d78e12; }

  /* ---------- 前台 ---------- */
  #frontStage {
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }
  #sentenceBar {
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border-bottom:2px solid #d5dde5;
    padding:10px 16px;
    min-height:78px;
    flex-shrink:0;
  }
  #sentenceItems {
    flex:1;
    display:flex;
    gap:8px;
    overflow-x:auto;
  }
  .sentence-item {
    display:flex;
    flex-direction:column;
    align-items:center;
    background:#eaf2fa;
    border-radius:8px;
    padding:4px 8px;
    min-width:50px;
  }
  .sentence-item img { width:40px; height:40px; object-fit:contain; }
  .sentence-item span { font-size:0.75rem; white-space:nowrap; }
  #playSentenceBtn { background:#2e9e5b; flex-shrink:0; }
  #playSentenceBtn:hover { background:#237a45; }
  #playSentenceBtn:disabled { background:#9bbfa9; cursor:default; }
  #clearSentenceBtn { background:#c0392b; flex-shrink:0; }
  #clearSentenceBtn:hover { background:#992d22; }

  #pageInfo { padding:8px 16px 0 16px; font-weight:bold; color:#555; flex-shrink:0; }

  .grid {
    display:grid;
    gap:12px;
    padding:16px;
    flex:1;
    min-height:0;
    overflow:hidden;
  }
  .cell {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:2px solid #cfd9e3;
    border-radius:12px;
    padding:8px;
    min-height:0;
    min-width:0;
    overflow:hidden;
    transition:transform .1s;
  }
  .cell:hover { border-color:#3d7ab5; transform:scale(1.02); }
  .cell:active { transform:scale(0.96); }
  .cell img { max-width:100%; max-height:65%; object-fit:contain; margin-bottom:6px; pointer-events:none; }
  .cell-label { font-size:1rem; text-align:center; pointer-events:none; }
  .empty-cell { border-style:dashed; color:#aaa; }

  /* ---------- 後台 ---------- */
  #backStage {
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    overflow-y:auto;
  }
  .back-toolbar {
    display:flex; flex-wrap:wrap; gap:18px;
    padding:12px 16px; background:#fff; border-bottom:2px solid #d5dde5;
    align-items:center;
    flex-shrink:0;
  }
  .back-toolbar > div { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .back-toolbar label { font-size:0.9rem; }
  .back-toolbar input[type=number] { width:55px; padding:4px; }

  .edit-cell { position:relative; }
  .jump-tag {
    position:absolute; top:4px; right:6px;
    font-size:0.7rem; background:#f5a623; color:#fff;
    border-radius:6px; padding:1px 5px;
  }

  /* ---------- 彈窗 ---------- */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center; z-index:100;
  }
  .modal {
    background:#fff; border-radius:12px; padding:20px; width:380px; max-width:92vw;
    display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow-y:auto;
  }
  .modal h3 { margin:0 0 4px 0; }
  .modal label { font-size:0.9rem; display:flex; flex-direction:column; gap:4px; }
  .modal input[type=text] { padding:6px; border:1px solid #ccc; border-radius:6px; font-size:1rem; }
  .file-picker { display:flex; flex-direction:column; gap:6px; border-top:1px solid #eee; padding-top:10px; }
  .file-picker .row { display:flex; align-items:center; gap:8px; }
  .file-picker img { max-width:100%; max-height:100px; object-fit:contain; align-self:flex-start; }
  .file-name { font-size:0.85rem; color:#555; }
  .action-setter { display:flex; flex-direction:column; gap:6px; border-top:1px solid #eee; padding-top:10px; font-size:0.9rem; }
  .action-setter label { flex-direction:row; align-items:center; gap:6px; }
  .modal-buttons { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
  #clearCellBtn { background:#c0392b; }
  #clearCellBtn:hover { background:#992d22; }
  #cancelCellBtn { background:#888; }
  #cancelCellBtn:hover { background:#666; }

  #backGrid {
    flex:none;
    min-height:auto;
    overflow:visible;
  }
  #backGrid .cell {
    min-height:110px;
  }

  .hint {
    font-size:0.8rem; color:#888; padding:0 16px 12px 16px;
    flex-shrink:0;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>AAC 溝通</h1>
    <button id="modeToggleBtn">切換到後台編輯</button>
  </header>

  <!-- ============ 前台：使用模式 ============ -->
  <section id="frontStage">
    <div id="sentenceBar">
      <div id="sentenceItems"></div>
      <button id="playSentenceBtn">播放語句</button>
      <button id="clearSentenceBtn">清除</button>
    </div>
    <div id="pageInfo">目前頁面：<span id="currentPageName"></span></div>
    <div id="frontGrid" class="grid"></div>
  </section>

  <!-- ============ 後台：編輯模式 ============ -->
  <section id="backStage" style="display:none;">
    <div class="back-toolbar">
      <div>
        <label>頁面：</label>
        <select id="pageSelect"></select>
        <button id="addPageBtn">新增頁面</button>
        <button id="renamePageBtn">重新命名</button>
        <button id="deletePageBtn">刪除頁面</button>
      </div>
      <div>
        <label>列 rows：<input type="number" id="rowsInput" min="1" max="10" value="3"></label>
        <label>欄 cols：<input type="number" id="colsInput" min="1" max="10" value="3"></label>
        <button id="applyGridBtn">套用格子數</button>
      </div>
      <div>
        <button id="exportBtn">匯出設定 JSON</button>
        <button id="importBtn">匯入設定 JSON</button>
        <input type="file" id="importFileInput" accept="application/json" style="display:none;">
      </div>
    </div>
    <div class="hint">
      點擊格子即可編輯內容。圖片請放在網頁同層的 <code>./pic</code> 資料夾，音檔請放在 <code>./wav</code> 資料夾，
      並確保檔名與此處選擇的檔名完全一致（瀏覽器基於安全性限制，只能取得檔名，無法取得完整路徑）。
    </div>
    <div id="backGrid" class="grid"></div>
  </section>

  <!-- ============ 格子編輯彈窗 ============ -->
  <div id="cellEditorModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>編輯格子</h3>
      <label>文字標籤
        <input type="text" id="cellLabelInput" placeholder="例如：喝水">
      </label>

      <div class="file-picker">
        <label>圖片檔案（./pic/）</label>
        <div class="row">
          <button id="pickImageBtn" type="button">選擇圖片</button>
          <span id="imageFileName" class="file-name">（未選擇）</span>
        </div>
        <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
        <img id="imagePreview" style="display:none;">
      </div>

      <div class="file-picker">
        <label>音檔（./wav/）</label>
        <div class="row">
          <button id="pickAudioBtn" type="button">選擇音檔</button>
          <span id="audioFileName" class="file-name">（未選擇）</span>
        </div>
        <input type="file" id="audioFileInput" accept="audio/*" style="display:none;">
        <audio id="audioPreview" controls style="display:none;"></audio>
      </div>

      <div class="action-setter">
        <label><input type="radio" name="actionType" value="speak" checked> 按下時播放語音</label>
        <label><input type="radio" name="actionType" value="jump"> 按下時跳到指定頁面</label>
        <select id="targetPageSelect" style="display:none;"></select>
      </div>

      <div class="modal-buttons">
        <button id="clearCellBtn" type="button">清空此格</button>
        <button id="cancelCellBtn" type="button">取消</button>
        <button id="saveCellBtn" type="button">儲存</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ===================== 資料結構 ===================== */
function makeDefaultPage(name, rows, cols) {
  return {
    name,
    rows,
    cols,
    cells: Array.from({ length: rows * cols }, () => ({
      label: '', image: '', audio: '', action: 'speak', targetPage: 0
    }))
  };
}

let appData = {
  pages: [ makeDefaultPage('首頁', 3, 3) ]
};

let currentPageIndex = 0;   // 前台目前顯示的頁
let editPageIndex = 0;      // 後台目前編輯的頁
let sentenceHistory = [];   // 語句列歷史
let editingCellIndex = null;

/* ===================== 共用：調整格子數 ===================== */
function resizePage(page, rows, cols) {
  const oldCells = page.cells;
  const oldCols = page.cols;
  const oldRows = page.rows;
  const newCells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (r < oldRows && c < oldCols) {
        newCells.push(oldCells[r * oldCols + c]);
      } else {
        newCells.push({ label: '', image: '', audio: '', action: 'speak', targetPage: 0 });
      }
    }
  }
  page.rows = rows;
  page.cols = cols;
  page.cells = newCells;
}

/* ===================== 前台：渲染 ===================== */
function renderFrontGrid() {
  const page = appData.pages[currentPageIndex];
  const grid = document.getElementById('frontGrid');
  grid.style.gridTemplateColumns = `repeat(${page.cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${page.rows}, 1fr)`;
  grid.innerHTML = '';

  page.cells.forEach((cell) => {
    const btn = document.createElement('button');
    btn.className = 'cell';
    if (!cell.image && !cell.label) btn.classList.add('empty-cell');

    if (cell.image) {
      const img = document.createElement('img');
      img.src = './pic/' + cell.image;
      img.alt = cell.label || '';
      btn.appendChild(img);
    }
    if (cell.label) {
      const span = document.createElement('span');
      span.className = 'cell-label';
      span.textContent = cell.label;
      btn.appendChild(span);
    }
    btn.addEventListener('click', () => handleCellClick(cell));
    grid.appendChild(btn);
  });

  document.getElementById('currentPageName').textContent = page.name;
}

function handleCellClick(cell) {
  if (!cell.image && !cell.label && !cell.audio) return; // 空白格不動作

  if (cell.action === 'jump') {
    const target = parseInt(cell.targetPage, 10);
    if (!isNaN(target) && appData.pages[target]) {
      currentPageIndex = target;
      renderFrontGrid();
    }
    return;
  }

  if (cell.audio) {
    const audio = new Audio('./wav/' + cell.audio);
    audio.play().catch((err) => console.warn('音檔播放失敗（請確認 ./wav 資料夾內有此檔案）:', err));
  }
  sentenceHistory.push(cell);
  renderSentenceBar();
}

function renderSentenceBar() {
  const container = document.getElementById('sentenceItems');
  container.innerHTML = '';
  sentenceHistory.forEach((cell) => {
    const item = document.createElement('div');
    item.className = 'sentence-item';
    if (cell.image) {
      const img = document.createElement('img');
      img.src = './pic/' + cell.image;
      item.appendChild(img);
    }
    const span = document.createElement('span');
    span.textContent = cell.label || '';
    item.appendChild(span);
    container.appendChild(item);
  });
}

document.getElementById('clearSentenceBtn').addEventListener('click', () => {
  sentenceHistory = [];
  renderSentenceBar();
});

function playOneAudio(cell) {
  return new Promise((resolve) => {
    if (!cell.audio) { resolve(); return; }
    const audio = new Audio('./wav/' + cell.audio);
    audio.addEventListener('ended', resolve);
    audio.addEventListener('error', () => {
      console.warn('音檔播放失敗（請確認 ./wav 資料夾內有此檔案）:', cell.audio);
      resolve();
    });
    audio.play().catch(() => resolve());
  });
}

document.getElementById('playSentenceBtn').addEventListener('click', async () => {
  if (sentenceHistory.length === 0) return;
  const btn = document.getElementById('playSentenceBtn');
  btn.disabled = true;
  for (const cell of sentenceHistory) {
    await playOneAudio(cell);
  }
  btn.disabled = false;
});

/* ===================== 後台：頁面管理 ===================== */
function renderPageSelect() {
  const sel = document.getElementById('pageSelect');
  sel.innerHTML = '';
  appData.pages.forEach((p, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = p.name;
    sel.appendChild(opt);
  });
  sel.value = editPageIndex;
}

function syncGridInputs() {
  const page = appData.pages[editPageIndex];
  document.getElementById('rowsInput').value = page.rows;
  document.getElementById('colsInput').value = page.cols;
}

document.getElementById('pageSelect').addEventListener('change', (e) => {
  editPageIndex = parseInt(e.target.value, 10);
  syncGridInputs();
  renderBackGrid();
});

document.getElementById('addPageBtn').addEventListener('click', () => {
  const name = prompt('請輸入新頁面名稱', '新頁面' + appData.pages.length);
  if (!name) return;
  appData.pages.push(makeDefaultPage(name, 3, 3));
  editPageIndex = appData.pages.length - 1;
  renderPageSelect();
  syncGridInputs();
  renderBackGrid();
});

document.getElementById('renamePageBtn').addEventListener('click', () => {
  const page = appData.pages[editPageIndex];
  const name = prompt('請輸入新名稱', page.name);
  if (!name) return;
  page.name = name;
  renderPageSelect();
  renderFrontGrid();
});

document.getElementById('deletePageBtn').addEventListener('click', () => {
  if (appData.pages.length <= 1) { alert('至少要保留一個頁面'); return; }
  if (!confirm('確定要刪除此頁面嗎？此動作無法復原。')) return;
  appData.pages.splice(editPageIndex, 1);
  editPageIndex = 0;
  currentPageIndex = 0;
  renderPageSelect();
  syncGridInputs();
  renderBackGrid();
  renderFrontGrid();
});

document.getElementById('applyGridBtn').addEventListener('click', () => {
  const rows = Math.max(1, parseInt(document.getElementById('rowsInput').value, 10) || 1);
  const cols = Math.max(1, parseInt(document.getElementById('colsInput').value, 10) || 1);
  const page = appData.pages[editPageIndex];
  resizePage(page, rows, cols);
  renderBackGrid();
});

/* ===================== 後台：格子網格渲染 ===================== */
function renderBackGrid() {
  const page = appData.pages[editPageIndex];
  const grid = document.getElementById('backGrid');
  grid.style.gridTemplateColumns = `repeat(${page.cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${page.rows}, 1fr)`;
  grid.innerHTML = '';

  page.cells.forEach((cell, idx) => {
    const btn = document.createElement('button');
    btn.className = 'cell edit-cell';
    if (!cell.image && !cell.label) btn.classList.add('empty-cell');

    if (cell.image) {
      const img = document.createElement('img');
      img.src = './pic/' + cell.image;
      btn.appendChild(img);
    }
    const span = document.createElement('span');
    span.className = 'cell-label';
    span.textContent = cell.label || `(格子 ${idx + 1})`;
    btn.appendChild(span);

    if (cell.action === 'jump') {
      const tag = document.createElement('div');
      tag.className = 'jump-tag';
      tag.textContent = '➜跳頁';
      btn.appendChild(tag);
    }

    btn.addEventListener('click', () => openCellEditor(idx));
    grid.appendChild(btn);
  });
}

/* ===================== 後台：格子編輯彈窗 ===================== */
function renderTargetPageSelect(selected) {
  const sel = document.getElementById('targetPageSelect');
  sel.innerHTML = '';
  appData.pages.forEach((p, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = p.name;
    sel.appendChild(opt);
  });
  sel.value = selected || 0;
}

function toggleTargetPageVisibility() {
  const checked = document.querySelector('input[name="actionType"]:checked').value;
  document.getElementById('targetPageSelect').style.display = checked === 'jump' ? 'inline-block' : 'none';
}
document.querySelectorAll('input[name="actionType"]').forEach((radio) => {
  radio.addEventListener('change', toggleTargetPageVisibility);
});

function openCellEditor(idx) {
  editingCellIndex = idx;
  const page = appData.pages[editPageIndex];
  const cell = page.cells[idx];

  document.getElementById('cellLabelInput').value = cell.label || '';

  document.getElementById('imageFileName').textContent = cell.image || '（未選擇）';
  const imgPrev = document.getElementById('imagePreview');
  imgPrev.dataset.filename = cell.image || '';
  if (cell.image) {
    imgPrev.src = './pic/' + cell.image;
    imgPrev.style.display = 'block';
  } else {
    imgPrev.style.display = 'none';
  }

  document.getElementById('audioFileName').textContent = cell.audio || '（未選擇）';
  const audioPrev = document.getElementById('audioPreview');
  audioPrev.dataset.filename = cell.audio || '';
  if (cell.audio) {
    audioPrev.src = './wav/' + cell.audio;
    audioPrev.style.display = 'block';
  } else {
    audioPrev.style.display = 'none';
  }

  document.querySelectorAll('input[name="actionType"]').forEach((radio) => {
    radio.checked = radio.value === cell.action;
  });
  renderTargetPageSelect(cell.targetPage);
  toggleTargetPageVisibility();

  document.getElementById('cellEditorModal').style.display = 'flex';
}

function closeCellEditor() {
  document.getElementById('cellEditorModal').style.display = 'none';
  editingCellIndex = null;
}

document.getElementById('pickImageBtn').addEventListener('click', () => {
  document.getElementById('imageFileInput').click();
});
document.getElementById('imageFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('imageFileName').textContent = file.name;
  const url = URL.createObjectURL(file);
  const imgPrev = document.getElementById('imagePreview');
  imgPrev.src = url;
  imgPrev.style.display = 'block';
  imgPrev.dataset.filename = file.name;
});

document.getElementById('pickAudioBtn').addEventListener('click', () => {
  document.getElementById('audioFileInput').click();
});
document.getElementById('audioFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('audioFileName').textContent = file.name;
  const url = URL.createObjectURL(file);
  const audioPrev = document.getElementById('audioPreview');
  audioPrev.src = url;
  audioPrev.style.display = 'block';
  audioPrev.dataset.filename = file.name;
});

document.getElementById('saveCellBtn').addEventListener('click', () => {
  const page = appData.pages[editPageIndex];
  const cell = page.cells[editingCellIndex];
  cell.label = document.getElementById('cellLabelInput').value.trim();
  cell.image = document.getElementById('imagePreview').dataset.filename || '';
  cell.audio = document.getElementById('audioPreview').dataset.filename || '';
  cell.action = document.querySelector('input[name="actionType"]:checked').value;
  cell.targetPage = parseInt(document.getElementById('targetPageSelect').value, 10) || 0;
  closeCellEditor();
  renderBackGrid();
  renderFrontGrid();
});

document.getElementById('clearCellBtn').addEventListener('click', () => {
  const page = appData.pages[editPageIndex];
  page.cells[editingCellIndex] = { label: '', image: '', audio: '', action: 'speak', targetPage: 0 };
  closeCellEditor();
  renderBackGrid();
  renderFrontGrid();
});

document.getElementById('cancelCellBtn').addEventListener('click', closeCellEditor);

/* ===================== 模式切換 ===================== */
document.getElementById('modeToggleBtn').addEventListener('click', () => {
  const front = document.getElementById('frontStage');
  const back = document.getElementById('backStage');
  const btn = document.getElementById('modeToggleBtn');
  if (back.style.display === 'none') {
    front.style.display = 'none';
    back.style.display = '';
    btn.textContent = '切換到前台使用';
    renderPageSelect();
    syncGridInputs();
    renderBackGrid();
  } else {
    front.style.display = '';
    back.style.display = 'none';
    btn.textContent = '切換到後台編輯';
    renderFrontGrid();
  }
});

/* ===================== 匯出／匯入設定 ===================== */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'aac_config.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFileInput').click();
});
document.getElementById('importFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = JSON.parse(evt.target.result);
      if (!data.pages || !Array.isArray(data.pages)) throw new Error('格式錯誤');
      appData = data;
      currentPageIndex = 0;
      editPageIndex = 0;
      renderPageSelect();
      syncGridInputs();
      renderBackGrid();
      renderFrontGrid();
      alert('匯入成功！');
    } catch (err) {
      alert('匯入失敗：檔案格式不正確');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ===================== 初始化 ===================== */
renderFrontGrid();
renderSentenceBar();
</script>
</body>
</html>
